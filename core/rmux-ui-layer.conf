# rmux UI layer, version 1.
#
# rmux runs this before ~/.tmux.conf unless it is started with -f, so any
# user configuration still wins. Choices saved by `rmux-agent settings` are
# @rmux-* options loaded from ~/.config/rmux/settings.conf just before this.
# Every conditional runs when the command runs, after those choices apply.
#
# Only tmux options and unbound keys are used: MouseDown1Control0..6 carry
# the buttons and each binding note starts with "rmux-ui:". tmux binds only
# Control7..9 by default. The settings screen re-runs sections on their own,
# so each section must stand alone.

## rmux:section base
if -F "#{!=:#{@rmux-ui},off}" {
	set -g @rmux-menu-stay-open on
	set -gF mouse "#{?#{@rmux-mouse},#{@rmux-mouse},on}"
	set -gF status "#{?#{@rmux-status},#{@rmux-status},on}"
	set -gF status-position "#{?#{@rmux-status-position},#{@rmux-status-position},bottom}"
	set -gF base-index "#{?#{@rmux-base-index},#{@rmux-base-index},0}"
	set -gF pane-base-index "#{?#{@rmux-base-index},#{@rmux-base-index},0}"
	set -gF renumber-windows "#{?#{@rmux-renumber},#{@rmux-renumber},off}"
	set -gF history-limit "#{?#{@rmux-history},#{@rmux-history},10000}"
}
## rmux:end

## rmux:section panes
if -F "#{!=:#{@rmux-ui},off}" {
	set -gF pane-border-status "#{?#{@rmux-pane-titles},#{@rmux-pane-titles},top}"
	set -gF pane-scrollbars "#{?#{@rmux-scrollbars},#{@rmux-scrollbars},modal}"
	set -gF pane-border-lines "#{?#{@rmux-border-lines},#{@rmux-border-lines},single}"
	set -g pane-border-format "#{?pane_active,#[fg=#{@rmux-c-accent}#,bold],#[fg=#{@rmux-c-muted}]}#[range=control|3] #{pane_index} #{?#{!=:#{pane_title},#{host}},#{pane_title},#{pane_current_command}} #[norange default]#{?#{mouse},#[align=right fg=#{@rmux-c-muted}]#[range=control|7] #{?#{pane_floating_flag},tile,float} #[norange]#[range=control|8] #{?#{window_zoomed_flag},unzoom,zoom} #[norange]#[range=control|9] x #[norange],}"
}
## rmux:end

## rmux:section colors
if -F "#{!=:#{@rmux-ui},off}" {
	if -F "#{==:#{@rmux-theme},light}" {
		set -g @rmux-c-panel "#fafbfb"
		set -g @rmux-c-raised "#dce3e6"
		set -g @rmux-c-text "#192229"
		set -g @rmux-c-muted "#54646f"
		set -g @rmux-c-accent "#00707f"
		set -g @rmux-c-accent-text "#ffffff"
		set -g @rmux-c-warning "#905400"
		set -g @rmux-c-track "#becacf"
	} {
		if -F "#{==:#{@rmux-theme},terminal}" {
			set -g @rmux-c-panel "default"
			set -g @rmux-c-raised "brightblack"
			set -g @rmux-c-text "default"
			set -g @rmux-c-muted "white"
			set -g @rmux-c-accent "cyan"
			set -g @rmux-c-accent-text "black"
			set -g @rmux-c-warning "yellow"
			set -g @rmux-c-track "brightblack"
		} {
			if -F "#{==:#{@rmux-theme},tmux}" {
				set -g @rmux-c-panel "default"
				set -g @rmux-c-raised "default"
				set -g @rmux-c-text "default"
				set -g @rmux-c-muted "default"
				set -g @rmux-c-accent "default"
				set -g @rmux-c-accent-text "default"
				set -g @rmux-c-warning "default"
				set -g @rmux-c-track "default"
			} {
				set -g @rmux-c-panel "#141a22"
				set -g @rmux-c-raised "#1f2731"
				set -g @rmux-c-text "#e6ebf1"
				set -g @rmux-c-muted "#9ba8b6"
				set -g @rmux-c-accent "#5bb5c2"
				set -g @rmux-c-accent-text "#051316"
				set -g @rmux-c-warning "#ebb85c"
				set -g @rmux-c-track "#303a45"
			}
		}
	}
}
## rmux:end

## rmux:section styles
# One option per line: the settings screen re-applies a line only while the
# option still holds the layer's value, so user configuration is kept. The
# tmux theme leaves these options at their tmux defaults.
if -F "#{&&:#{!=:#{@rmux-ui},off},#{!=:#{@rmux-theme},tmux}}" {
	set -gF status-style "bg=#{@rmux-c-panel},fg=#{@rmux-c-muted}"
	set -gF window-status-style "fg=#{@rmux-c-muted}"
	set -gF window-status-current-style "bg=#{@rmux-c-raised},fg=#{@rmux-c-text},bold"
	set -gF window-status-activity-style "fg=#{@rmux-c-warning}"
	set -gF window-status-bell-style "fg=#{@rmux-c-warning},bold"
	set -gF message-style "bg=#{@rmux-c-raised},fg=#{@rmux-c-text}"
	set -gF message-command-style "bg=#{@rmux-c-raised},fg=#{@rmux-c-accent}"
	set -gF mode-style "bg=#{@rmux-c-accent},fg=#{@rmux-c-accent-text}"
	set -gF pane-border-style "fg=#{@rmux-c-track}"
	set -gF pane-active-border-style "fg=#{@rmux-c-accent}"
	set -gF menu-style "bg=#{@rmux-c-panel},fg=#{@rmux-c-text}"
	set -gF menu-selected-style "bg=#{@rmux-c-accent},fg=#{@rmux-c-accent-text}"
	set -gF menu-border-style "fg=#{@rmux-c-accent}"
	set -gF clock-mode-colour "#{@rmux-c-accent}"
}
## rmux:end

## rmux:section bar
if -F "#{!=:#{@rmux-ui},off}" {
	set -g status-justify left
	set -g status-left-length 40
	set -g status-right-length 60
	set -g window-status-separator ""
	set -g window-status-format " #I #W#{?window_zoomed_flag, +,}#{?window_bell_flag, !,}#{?window_activity_flag, #,} "
	set -g window-status-current-format " #I #W#{?window_zoomed_flag, +,}#{?window_bell_flag, !,}#{?window_activity_flag, #,} "
	set -g status-left "#[range=control|5 fg=#{@rmux-c-accent} bold] rmux #[norange default]#[fg=#{@rmux-c-text}]#{=/20/...:session_name} #{?#{m/r:^(left|right)$,#{status-position}},#[align=right fg=#{@rmux-c-muted}]#[range=control|4]#{?#{e|<=:#{?#{@rmux-status-width},#{@rmux-status-width},24},8},>,<} #[norange],}"
	set -g status-right "#{?#{m/r:^(left|right)$,#{status-position}},#[range=control|0 fg=#{@rmux-c-accent}] + #{?#{==:#{@rmux-lang},ko},새 창,New}#[norange default] ,}#{?#{==:#{@rmux-clock},off},,#[fg=#{@rmux-c-muted}]%H:%M }#[range=control|1 bg=#{@rmux-c-raised} fg=#{@rmux-c-text}] #{?#{==:#{@rmux-lang},ko},설정,Settings} #[norange default]"
	set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist]#[range=control|0 fg=#{@rmux-c-accent}] + #[norange default]#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
}
## rmux:end

## rmux:section keys
if -F "#{!=:#{@rmux-ui},off}" {
	bind -N "rmux-ui: new window" -n MouseDown1Control0 { new-window }
	bind -N "rmux-ui: settings" -n MouseDown1Control1 { run -C "new-pane -O -K -x 90% -y 90% -X 5% -Y 5% '#{q:@rmux-agent} settings'" }
	bind -N "rmux-ui: new session" -n MouseDown1Control2 { new-session }
	bind -N "rmux-ui: toggle sidebar width" -n MouseDown1Control4 { if -F "#{e|<=:#{?#{@rmux-status-width},#{@rmux-status-width},24},8}" { set -gF @rmux-status-width "#{?#{@rmux-sidebar-width},#{@rmux-sidebar-width},24}" } { set -gF @rmux-sidebar-width "#{?#{@rmux-status-width},#{@rmux-status-width},24}" ; set -g @rmux-status-width 8 } }
	if -F "#{==:#{@rmux-lang},ko}" {
		bind -N "rmux-ui: rename pane" -n MouseDown1Control3 { select-pane -t= ; command-prompt -FI "#{pane_title}" -p "pane 이름:" { select-pane -T '%%' } }
		bind -N "rmux-ui: menu" -n MouseDown1Control5 { display-menu -t= -xM -yM -T "#[align=centre]rmux" "설정" s { run -C "new-pane -O -K -x 90% -y 90% -X 5% -Y 5% '##{q:@rmux-agent} settings'" } "" "새 창" c { new-window } "새 세션" S { new-session } "세션과 창 목록" w { choose-tree -Zs } "오른쪽으로 분할" "%" { split-window -h } "아래로 분할" "\"" { split-window -v } "" "키 목록" "?" { list-keys -N } "tmux 설정 다시 읽기" r { source-file -q /etc/tmux.conf ~/.tmux.conf ~/.config/tmux/tmux.conf } "분리" d { detach-client } }
	} {
		bind -N "rmux-ui: rename pane" -n MouseDown1Control3 { select-pane -t= ; command-prompt -FI "#{pane_title}" -p "Pane name:" { select-pane -T '%%' } }
		bind -N "rmux-ui: menu" -n MouseDown1Control5 { display-menu -t= -xM -yM -T "#[align=centre]rmux" "Settings" s { run -C "new-pane -O -K -x 90% -y 90% -X 5% -Y 5% '##{q:@rmux-agent} settings'" } "" "New window" c { new-window } "New session" S { new-session } "Sessions and windows" w { choose-tree -Zs } "Split right" "%" { split-window -h } "Split down" "\"" { split-window -v } "" "Key list" "?" { list-keys -N } "Reload tmux config" r { source-file -q /etc/tmux.conf ~/.tmux.conf ~/.config/tmux/tmux.conf } "Detach" d { detach-client } }
	}
}
## rmux:end
