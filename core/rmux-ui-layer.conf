# rmux UI layer, version 1.
#
# rmux runs this before ~/.tmux.conf unless it is started with -f, so any
# user configuration still wins. Choices saved by `rmux-agent settings` are
# @rmux-* options loaded from ~/.config/rmux/settings.conf just before this.
# Every conditional runs when the command runs, after those choices apply.
#
# Only tmux options and unbound keys are used: MouseDown1Control0..6 carry
# the buttons and each binding note starts with "rmux-ui:". tmux binds only
# Control7..9 by default. The settings screen re-runs sections on their own,
# so each section must stand alone.

## rmux:section base
if -F "#{!=:#{@rmux-ui},off}" {
	set -g @rmux-menu-stay-open on
	set -gF mouse "#{?#{@rmux-mouse},#{@rmux-mouse},on}"
	set -gF status "#{?#{@rmux-status},#{@rmux-status},on}"
	set -gF status-position "#{?#{@rmux-status-position},#{@rmux-status-position},bottom}"
	set -gF base-index "#{?#{@rmux-base-index},#{@rmux-base-index},0}"
	set -gF pane-base-index "#{?#{@rmux-base-index},#{@rmux-base-index},0}"
	set -gF renumber-windows "#{?#{@rmux-renumber},#{@rmux-renumber},off}"
	set -gF history-limit "#{?#{@rmux-history},#{@rmux-history},10000}"
}
## rmux:end

## rmux:section panes
# User text sits in a one-item list, which tmux shortens first and ends with
# "…". Buttons that would leave the title under six cells are dropped, float
# first, then +, then zoom, then x. + opens the split menu; a split of a
# floating pane joins it in a floating group (split-window -G).
if -F "#{!=:#{@rmux-ui},off}" {
	set -gF pane-border-status "#{?#{@rmux-pane-titles},#{@rmux-pane-titles},top}"
	set -gF pane-scrollbars "#{?#{@rmux-scrollbars},#{@rmux-scrollbars},modal}"
	set -gF pane-border-lines "#{?#{@rmux-border-lines},#{@rmux-border-lines},single}"
	set -g pane-border-format "#{?pane_active,#[fg=#{@rmux-c-accent}#,bold],#[fg=#{@rmux-c-muted}]}#[range=control|3] #{pane_index} #[norange]#[list=on align=left]#[list=right-marker]…#[list=on range=control|3]#{?#{!=:#{pane_title},#{host}},#{pane_title},#{pane_current_command}} #[norange]#[nolist default]#{?#{mouse},#[align=right fg=#{@rmux-c-muted}]#{?#{e|>=:#{pane_width},26},#[range=control|6] + #[norange],}#{?#{e|>=:#{pane_width},33},#[range=control|7] #{?#{pane_floating_flag},tile,float} #[norange],}#{?#{e|>=:#{pane_width},23},#[range=control|8] #{?#{window_zoomed_flag},unzoom,zoom} #[norange],}#{?#{e|>=:#{pane_width},15},#[range=control|9] x #[norange],},}"
}
## rmux:end

## rmux:section colors
if -F "#{!=:#{@rmux-ui},off}" {
	if -F "#{==:#{@rmux-theme},light}" {
		set -g @rmux-c-panel "#fafbfb"
		set -g @rmux-c-raised "#dce3e6"
		set -g @rmux-c-text "#192229"
		set -g @rmux-c-muted "#54646f"
		set -g @rmux-c-accent "#00707f"
		set -g @rmux-c-accent-text "#ffffff"
		set -g @rmux-c-warning "#905400"
		set -g @rmux-c-track "#becacf"
	} {
		if -F "#{==:#{@rmux-theme},terminal}" {
			set -g @rmux-c-panel "default"
			set -g @rmux-c-raised "brightblack"
			set -g @rmux-c-text "default"
			set -g @rmux-c-muted "white"
			set -g @rmux-c-accent "cyan"
			set -g @rmux-c-accent-text "black"
			set -g @rmux-c-warning "yellow"
			set -g @rmux-c-track "brightblack"
		} {
			if -F "#{==:#{@rmux-theme},tmux}" {
				set -g @rmux-c-panel "default"
				set -g @rmux-c-raised "default"
				set -g @rmux-c-text "default"
				set -g @rmux-c-muted "default"
				set -g @rmux-c-accent "default"
				set -g @rmux-c-accent-text "default"
				set -g @rmux-c-warning "default"
				set -g @rmux-c-track "default"
			} {
				set -g @rmux-c-panel "#141a22"
				set -g @rmux-c-raised "#1f2731"
				set -g @rmux-c-text "#e6ebf1"
				set -g @rmux-c-muted "#9ba8b6"
				set -g @rmux-c-accent "#5bb5c2"
				set -g @rmux-c-accent-text "#051316"
				set -g @rmux-c-warning "#ebb85c"
				set -g @rmux-c-track "#303a45"
			}
		}
	}
}
## rmux:end

## rmux:section styles
# One option per line: the settings screen re-applies a line only while the
# option still holds the layer's value, so user configuration is kept. The
# tmux theme leaves these options at their tmux defaults.
if -F "#{&&:#{!=:#{@rmux-ui},off},#{!=:#{@rmux-theme},tmux}}" {
	set -gF status-style "bg=#{@rmux-c-panel},fg=#{@rmux-c-muted}"
	set -gF window-status-style "fg=#{@rmux-c-muted}"
	set -gF window-status-current-style "bg=#{@rmux-c-raised},fg=#{@rmux-c-text},bold"
	set -gF window-status-activity-style "fg=#{@rmux-c-warning}"
	set -gF window-status-bell-style "fg=#{@rmux-c-warning},bold"
	set -gF message-style "bg=#{@rmux-c-raised},fg=#{@rmux-c-text}"
	set -gF message-command-style "bg=#{@rmux-c-raised},fg=#{@rmux-c-accent}"
	set -gF mode-style "bg=#{@rmux-c-accent},fg=#{@rmux-c-accent-text}"
	set -gF pane-border-style "fg=#{@rmux-c-track}"
	set -gF pane-active-border-style "fg=#{@rmux-c-accent}"
	set -gF menu-style "bg=#{@rmux-c-panel},fg=#{@rmux-c-text}"
	set -gF menu-selected-style "bg=#{@rmux-c-accent},fg=#{@rmux-c-accent-text}"
	set -gF menu-border-style "fg=#{@rmux-c-accent}"
	set -gF clock-mode-colour "#{@rmux-c-accent}"
}
## rmux:end

## rmux:section bar
# Narrow bars and sidebars drop the clock, then shorten "+ New" to "+",
# then drop Settings, which stays in the rmux menu. The sidebar shortens
# the session and window names with "…" before any button or flag.
if -F "#{!=:#{@rmux-ui},off}" {
	set -g status-justify left
	set -g status-left-length 40
	set -g status-right-length 60
	set -g window-status-separator ""
	set -g window-status-format " #I #{?#{m/r:^(left|right)$,#{status-position}},#[list=on align=left]#[list=right-marker]…#[list=on]#W#[nolist],#{=/#{e|/:#{client_width},4}/…:window_name}}#{?window_zoomed_flag, +,}#{?window_bell_flag, !,}#{?window_activity_flag, #,} "
	set -g window-status-current-format " #I #{?#{m/r:^(left|right)$,#{status-position}},#[list=on align=left]#[list=right-marker]…#[list=on]#W#[nolist],#{=/#{e|/:#{client_width},4}/…:window_name}}#{?window_zoomed_flag, +,}#{?window_bell_flag, !,}#{?window_activity_flag, #,} "
	set -g status-left "#[range=control|5 fg=#{@rmux-c-accent} bold] rmux #[norange default]#{?#{m/r:^(left|right)$,#{status-position}},#[list=on align=left fg=#{@rmux-c-text}]#[list=right-marker]…#[list=on]#{=/20/…:session_name} #[nolist align=right fg=#{@rmux-c-muted}]#[range=control|4] #{?#{e|<=:#{?#{@rmux-status-width},#{@rmux-status-width},24},8},>,<} #[norange],#{?#{e|>=:#{client_width},40},#[fg=#{@rmux-c-text}]#{=/#{?#{e|<:#{client_width},56},#{e|-:#{client_width},36},20}/…:session_name} ,}}"
	set -g status-right "#{?#{m/r:^(left|right)$,#{status-position}},#[range=control|0 fg=#{@rmux-c-accent}] +#{?#{e|>=:#{?#{@rmux-status-width},#{@rmux-status-width},24},#{?#{==:#{@rmux-lang},ko},15,17}}, #{?#{==:#{@rmux-lang},ko},새 창,New},}#[norange default] ,}#{?#{&&:#{!=:#{@rmux-clock},off},#{?#{m/r:^(left|right)$,#{status-position}},#{e|>=:#{?#{@rmux-status-width},#{@rmux-status-width},24},#{?#{==:#{@rmux-lang},ko},21,23}},#{e|>=:#{client_width},70}}},#[fg=#{@rmux-c-muted}]%H:%M ,}#{?#{?#{m/r:^(left|right)$,#{status-position}},#{e|>=:#{?#{@rmux-status-width},#{@rmux-status-width},24},#{?#{==:#{@rmux-lang},ko},9,13}},#{e|>=:#{client_width},#{?#{==:#{@rmux-lang},ko},20,24}}},#[range=control|1 bg=#{@rmux-c-raised} fg=#{@rmux-c-text}] #{?#{==:#{@rmux-lang},ko},설정,Settings} #[norange default],}"
	set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist]#[range=control|0 fg=#{@rmux-c-accent}] + #[norange default]#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
}
## rmux:end

## rmux:section keys
# A window under 14 rows or 28 columns (36 in Korean, as menus measure
# labels in bytes) gets a compact menu: short labels, no separators, and
# below 15, 13, 12, 10 and 9 rows fewer items. Settings stays first. +
# opens a choice of new window, floating pane or split; Layout picks a tiled
# layout. A pane title click renames the pane and a drag moves it. C-s saves
# the sessions and C-r (or the menu) picks a snapshot to restore; snapshots
# are also saved every @rmux-autosave minutes (default 15, off to stop).
if -F "#{!=:#{@rmux-ui},off}" {
	bind -N "rmux-ui: settings" -n MouseDown1Control1 { run -C "new-pane -O -K -x 90% -y 90% -X 5% -Y 5% '#{q:@rmux-agent} settings'" }
	bind -N "rmux-ui: new session" -n MouseDown1Control2 { new-session }
	bind -N "rmux-ui: select pane" -n MouseDown1Control3 { select-pane -t= }
	bind -N "rmux-ui: move pane" -n MouseDrag1Control3 { resize-pane -M }
	bind -N "rmux-ui: toggle sidebar width" -n MouseDown1Control4 { if -F "#{e|<=:#{?#{@rmux-status-width},#{@rmux-status-width},24},8}" { set -gF @rmux-status-width "#{?#{@rmux-sidebar-width},#{@rmux-sidebar-width},24}" } { set -gF @rmux-sidebar-width "#{?#{@rmux-status-width},#{@rmux-status-width},24}" ; set -g @rmux-status-width 8 } }
	if -F "#{==:#{@rmux-lang},ko}" {
		bind -N "rmux-ui: rename pane" -n MouseUp1Control3 { select-pane -t= ; command-prompt -FI "#{pane_title}" -p "pane 이름:" { select-pane -T '%%' } }
		bind -N "rmux-ui: new" -n MouseDown1Control0 { display-menu -t= -xM -yM -T "#[align=centre]새로 만들기" "새 창" c { new-window } "새 floating pane" f { new-pane -x 60% -y 60% } "오른쪽 분할" "%" { split-window -G -h } "아래로 분할" "\"" { split-window -G -v } }
		bind -N "rmux-ui: split pane" -n MouseDown1Control6 { display-menu -t= -xM -yM -T "#[align=centre]pane #{pane_index}" "오른쪽 분할" "%" { split-window -G -h } "아래로 분할" "\"" { split-window -G -v } "새 floating pane" f { new-pane -x 60% -y 60% } }
		bind -N "rmux-ui: menu" -n MouseDown1Control5 { if -F "#{||:#{e|<:#{window_height},14},#{e|<:#{window_width},36}}" { display-menu -t= -xM -yM -T "#[align=centre]rmux" "설정" s { run -C "new-pane -O -K -x 90% -y 90% -X 5% -Y 5% '##{q:@rmux-agent} settings'" } "에이전트" a { new-window -n Agents '#{q:@rmux-agent} agent ui' } "새 창" c { new-window } "#{?#{e|>=:#{window_height},10},새 세션,}" S { new-session } "세션 목록" w { choose-tree -Zs } "#{?#{e|>=:#{window_height},15},세션 저장,}" C-s { run-shell -b "#{q:@rmux-agent} session save --socket #{q:socket_path} --client #{q:client_name}" } "#{?#{e|>=:#{window_height},15},세션 불러오기,}" C-r { run-shell -b "#{q:@rmux-agent} session menu --socket #{q:socket_path} --client #{q:client_name}" } "#{?#{e|>=:#{window_height},9},오른쪽 분할,}" "%" { split-window -G -h } "#{?#{e|>=:#{window_height},9},아래로 분할,}" "\"" { split-window -G -v } "#{?#{e|>=:#{window_height},13},레이아웃,}" l { display-menu -x C -y C -T "#[align=centre]레이아웃" "좌우로 나란히" h { select-layout even-horizontal } "위아래로 쌓기" v { select-layout even-vertical } "왼쪽에 큰 pane" m { select-layout main-vertical } "위에 큰 pane" M { select-layout main-horizontal } "격자" g { select-layout tiled } } "#{?#{e|>=:#{window_height},12},키 목록,}" "?" { list-keys -N } "#{?#{e|>=:#{window_height},12},tmux 설정 읽기,}" r { source-file -q /etc/tmux.conf ~/.tmux.conf ~/.config/tmux/tmux.conf } "분리" d { detach-client } } { display-menu -t= -xM -yM -T "#[align=centre]rmux" "설정" s { run -C "new-pane -O -K -x 90% -y 90% -X 5% -Y 5% '##{q:@rmux-agent} settings'" } "에이전트" a { new-window -n Agents '#{q:@rmux-agent} agent ui' } "" "새 창" c { new-window } "새 세션" S { new-session } "세션과 창 목록" w { choose-tree -Zs } "세션 저장" C-s { run-shell -b "#{q:@rmux-agent} session save --socket #{q:socket_path} --client #{q:client_name}" } "세션 불러오기" C-r { run-shell -b "#{q:@rmux-agent} session menu --socket #{q:socket_path} --client #{q:client_name}" } "오른쪽으로 분할" "%" { split-window -G -h } "아래로 분할" "\"" { split-window -G -v } "레이아웃" l { display-menu -x C -y C -T "#[align=centre]레이아웃" "좌우로 나란히" h { select-layout even-horizontal } "위아래로 쌓기" v { select-layout even-vertical } "왼쪽에 큰 pane" m { select-layout main-vertical } "위에 큰 pane" M { select-layout main-horizontal } "격자" g { select-layout tiled } } "" "키 목록" "?" { list-keys -N } "tmux 설정 다시 읽기" r { source-file -q /etc/tmux.conf ~/.tmux.conf ~/.config/tmux/tmux.conf } "분리" d { detach-client } } }
	} {
		bind -N "rmux-ui: rename pane" -n MouseUp1Control3 { select-pane -t= ; command-prompt -FI "#{pane_title}" -p "Pane name:" { select-pane -T '%%' } }
		bind -N "rmux-ui: new" -n MouseDown1Control0 { display-menu -t= -xM -yM -T "#[align=centre]New" "Window" c { new-window } "Floating pane" f { new-pane -x 60% -y 60% } "Split right" "%" { split-window -G -h } "Split down" "\"" { split-window -G -v } }
		bind -N "rmux-ui: split pane" -n MouseDown1Control6 { display-menu -t= -xM -yM -T "#[align=centre]Pane #{pane_index}" "Split right" "%" { split-window -G -h } "Split down" "\"" { split-window -G -v } "Floating pane" f { new-pane -x 60% -y 60% } }
		bind -N "rmux-ui: menu" -n MouseDown1Control5 { if -F "#{||:#{e|<:#{window_height},14},#{e|<:#{window_width},28}}" { display-menu -t= -xM -yM -T "#[align=centre]rmux" "Settings" s { run -C "new-pane -O -K -x 90% -y 90% -X 5% -Y 5% '##{q:@rmux-agent} settings'" } "Agents" a { new-window -n Agents '#{q:@rmux-agent} agent ui' } "New window" c { new-window } "#{?#{e|>=:#{window_height},10},New session,}" S { new-session } "Sessions" w { choose-tree -Zs } "#{?#{e|>=:#{window_height},15},Save sessions,}" C-s { run-shell -b "#{q:@rmux-agent} session save --socket #{q:socket_path} --client #{q:client_name}" } "#{?#{e|>=:#{window_height},15},Restore sessions,}" C-r { run-shell -b "#{q:@rmux-agent} session menu --socket #{q:socket_path} --client #{q:client_name}" } "#{?#{e|>=:#{window_height},9},Split right,}" "%" { split-window -G -h } "#{?#{e|>=:#{window_height},9},Split down,}" "\"" { split-window -G -v } "#{?#{e|>=:#{window_height},13},Layout,}" l { display-menu -x C -y C -T "#[align=centre]Layout" "Side by side" h { select-layout even-horizontal } "Stacked" v { select-layout even-vertical } "Main left" m { select-layout main-vertical } "Main top" M { select-layout main-horizontal } "Grid" g { select-layout tiled } } "#{?#{e|>=:#{window_height},12},Key list,}" "?" { list-keys -N } "#{?#{e|>=:#{window_height},12},Reload config,}" r { source-file -q /etc/tmux.conf ~/.tmux.conf ~/.config/tmux/tmux.conf } "Detach" d { detach-client } } { display-menu -t= -xM -yM -T "#[align=centre]rmux" "Settings" s { run -C "new-pane -O -K -x 90% -y 90% -X 5% -Y 5% '##{q:@rmux-agent} settings'" } "Agents" a { new-window -n Agents '#{q:@rmux-agent} agent ui' } "" "New window" c { new-window } "New session" S { new-session } "Sessions and windows" w { choose-tree -Zs } "Save sessions" C-s { run-shell -b "#{q:@rmux-agent} session save --socket #{q:socket_path} --client #{q:client_name}" } "Restore sessions" C-r { run-shell -b "#{q:@rmux-agent} session menu --socket #{q:socket_path} --client #{q:client_name}" } "Split right" "%" { split-window -G -h } "Split down" "\"" { split-window -G -v } "Layout" l { display-menu -x C -y C -T "#[align=centre]Layout" "Side by side" h { select-layout even-horizontal } "Stacked" v { select-layout even-vertical } "Main left" m { select-layout main-vertical } "Main top" M { select-layout main-horizontal } "Grid" g { select-layout tiled } } "" "Key list" "?" { list-keys -N } "Reload tmux config" r { source-file -q /etc/tmux.conf ~/.tmux.conf ~/.config/tmux/tmux.conf } "Detach" d { detach-client } } }
	}
}
## rmux:end

## rmux:section sessions
# Saving and restoring sessions. Kept apart from the keys section, which the
# settings screen re-runs, so a user's own prefix C-s or C-r binding stays.
if -F "#{!=:#{@rmux-ui},off}" {
	bind -N "rmux-ui: save sessions" C-s { run-shell -b "#{q:@rmux-agent} session save --socket #{q:socket_path} --client #{q:client_name}" }
	bind -N "rmux-ui: restore sessions" C-r { run-shell -b "#{q:@rmux-agent} session menu --socket #{q:socket_path} --client #{q:client_name}" }
	run-shell -b "#{q:@rmux-agent} session autosave --socket #{q:socket_path}"
}
## rmux:end
