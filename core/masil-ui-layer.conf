# masil UI layer, version 1.
#
# masil runs this before ~/.tmux.conf unless it is started with -f, so any
# user configuration still wins. Choices saved by `masil-agent settings` are
# @masil-* options loaded from ~/.config/masil/settings.conf just before this.
# Every conditional runs when the command runs, after those choices apply.
#
# Only tmux options and unbound keys are used: MouseDown1Control0..6 carry
# the buttons and each binding note starts with "masil-ui:". tmux binds only
# Control7..9 by default. The settings screen re-runs sections on their own,
# so each section must stand alone.

## masil:section base
if -F "#{!=:#{@masil-ui},off}" {
	# Refresh the inherited colour hint when a different terminal attaches.
	if -F "#{!:#{m/r:(^| )COLORTERM( |$),#{update-environment}}}" {
		set -ag update-environment COLORTERM
	}
	set -g @masil-menu-stay-open on
	set -gF mouse "#{?#{@masil-mouse},#{@masil-mouse},on}"
	set -gF status "#{?#{@masil-status},#{@masil-status},on}"
	set -gF status-position "#{?#{@masil-status-position},#{@masil-status-position},bottom}"
	set -gF base-index "#{?#{@masil-base-index},#{@masil-base-index},0}"
	set -gF pane-base-index "#{?#{@masil-base-index},#{@masil-base-index},0}"
	set -gF renumber-windows "#{?#{@masil-renumber},#{@masil-renumber},off}"
	set -gF history-limit "#{?#{@masil-history},#{@masil-history},10000}"
}
## masil:end

## masil:section panes
# User text sits in a one-item list, which tmux shortens first and ends with
# "…". Buttons that would leave the title under six cells are dropped, float
# first, then +, then zoom, then x. + opens the split menu; a split of a
# floating pane joins it in a floating group (split-window -G).
if -F "#{!=:#{@masil-ui},off}" {
	set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?masil_pane_agent_name,#{masil_pane_agent_name},#{pane_current_command}}}#{?pane_dead,[dead],}"
	set -gF pane-border-status "#{?#{@masil-pane-titles},#{@masil-pane-titles},top}"
	set -gF pane-scrollbars "#{?#{@masil-scrollbars},#{@masil-scrollbars},modal}"
	set -gF pane-border-lines "#{?#{@masil-border-lines},#{@masil-border-lines},single}"
	set -g pane-border-format "#{?pane_active,#[fg=#{@masil-c-accent}#,bold],#[fg=#{@masil-c-muted}]}#[range=control|3] #{pane_index} #[norange]#[list=on align=left]#[list=right-marker]…#[list=on range=control|3]#{?#{!=:#{pane_title},#{host}},#{pane_title},#{pane_current_command}} #[norange]#[nolist default]#{?#{mouse},#[align=right fg=#{@masil-c-muted}]#{?#{e|>=:#{pane_width},26},#[range=control|6] + #[norange],}#{?#{e|>=:#{pane_width},33},#[range=control|7] #{?#{pane_floating_flag},tile,float} #[norange],}#{?#{e|>=:#{pane_width},23},#[range=control|8] #{?#{window_zoomed_flag},unzoom,zoom} #[norange],}#{?#{e|>=:#{pane_width},15},#[range=control|9] x #[norange],},}"
}
## masil:end

## masil:section colors
if -F "#{!=:#{@masil-ui},off}" {
	if -F "#{==:#{@masil-theme},light}" {
		set -g @masil-c-panel "#fafbfb"
		set -g @masil-c-raised "#dce3e6"
		set -g @masil-c-text "#192229"
		set -g @masil-c-muted "#54646f"
		set -g @masil-c-accent "#00707f"
		set -g @masil-c-accent-text "#ffffff"
		set -g @masil-c-warning "#905400"
		set -g @masil-c-track "#becacf"
	} {
		if -F "#{==:#{@masil-theme},terminal}" {
			set -g @masil-c-panel "default"
			set -g @masil-c-raised "brightblack"
			set -g @masil-c-text "default"
			set -g @masil-c-muted "white"
			set -g @masil-c-accent "cyan"
			set -g @masil-c-accent-text "black"
			set -g @masil-c-warning "yellow"
			set -g @masil-c-track "brightblack"
		} {
			if -F "#{==:#{@masil-theme},tmux}" {
				set -g @masil-c-panel "default"
				set -g @masil-c-raised "default"
				set -g @masil-c-text "default"
				set -g @masil-c-muted "default"
				set -g @masil-c-accent "default"
				set -g @masil-c-accent-text "default"
				set -g @masil-c-warning "default"
				set -g @masil-c-track "default"
			} {
				set -g @masil-c-panel "#141a22"
				set -g @masil-c-raised "#1f2731"
				set -g @masil-c-text "#e6ebf1"
				set -g @masil-c-muted "#9ba8b6"
				set -g @masil-c-accent "#5bb5c2"
				set -g @masil-c-accent-text "#051316"
				set -g @masil-c-warning "#ebb85c"
				set -g @masil-c-track "#303a45"
			}
		}
	}
}
## masil:end

## masil:section styles
# One option per line: the settings screen re-applies a line only while the
# option still holds the layer's value, so user configuration is kept. The
# tmux theme leaves these options at their tmux defaults.
if -F "#{&&:#{!=:#{@masil-ui},off},#{!=:#{@masil-theme},tmux}}" {
	set -gF status-style "bg=#{@masil-c-panel},fg=#{@masil-c-muted}"
	set -gF window-status-style "fg=#{@masil-c-muted}"
	set -gF window-status-current-style "bg=#{@masil-c-raised},fg=#{@masil-c-text},bold"
	set -gF window-status-activity-style "fg=#{@masil-c-warning}"
	set -gF window-status-bell-style "fg=#{@masil-c-warning},bold"
	set -gF message-style "bg=#{@masil-c-raised},fg=#{@masil-c-text}"
	set -gF message-command-style "bg=#{@masil-c-raised},fg=#{@masil-c-accent}"
	set -gF mode-style "bg=#{@masil-c-accent},fg=#{@masil-c-accent-text}"
	set -gF pane-border-style "fg=#{@masil-c-track}"
	set -gF pane-active-border-style "fg=#{@masil-c-accent}"
	set -gF menu-style "bg=#{@masil-c-panel},fg=#{@masil-c-text}"
	set -gF menu-selected-style "bg=#{@masil-c-accent},fg=#{@masil-c-accent-text}"
	set -gF menu-border-style "fg=#{@masil-c-accent}"
	set -gF clock-mode-colour "#{@masil-c-accent}"
}
## masil:end

## masil:section bar
# Save and Load stay beside Settings on ordinary bars and sidebars.
# Narrow bars keep these actions in the masil menu. Clocks yield first;
# session and tab names shorten before the remaining controls.
# Tab commands quote both tmux arguments and hashes before the menu reparses
# them, preserving quotes and literal formats in the clicked pane's path.
if -F "#{!=:#{@masil-ui},off}" {
	set -g status-justify left
	set -g status-left-length 40
	set -g status-right-length 60
	set -g window-status-separator ""
	set -g window-status-format " #I #{?#{m/r:^(left|right)$,#{status-position}},#[list=on align=left]#[list=right-marker]…#[list=on]#W#[nolist],#{=/#{e|/:#{client_width},4}/…:window_name}}#{?window_zoomed_flag, +,}#{?window_bell_flag, !,}#{?window_activity_flag, #,} "
	set -g window-status-current-format " #I #{?#{m/r:^(left|right)$,#{status-position}},#[list=on align=left]#[list=right-marker]…#[list=on]#W#[nolist],#{=/#{e|/:#{client_width},4}/…:window_name}}#{?window_zoomed_flag, +,}#{?window_bell_flag, !,}#{?window_activity_flag, #,} "
	set -g status-left "#[range=control|5 fg=#{@masil-c-accent} bold] masil #[norange default]#{?#{m/r:^(left|right)$,#{status-position}},#[list=on align=left fg=#{@masil-c-text}]#[list=right-marker]…#[list=on]#{=/20/…:session_name} #[nolist align=right fg=#{@masil-c-muted}]#[range=control|4] #{?#{e|<=:#{?#{@masil-status-width},#{@masil-status-width},24},8},>,<} #[norange],#{?#{e|>=:#{client_width},40},#[fg=#{@masil-c-text}]#{=/#{?#{e|<:#{client_width},56},#{e|-:#{client_width},36},20}/…:session_name} ,}}"
	set -g status-right "#{?#{m/r:^(left|right)$,#{status-position}},#[range=control|0 fg=#{@masil-c-accent}] + #[norange default]#{?#{e|>=:#{?#{@masil-status-width},#{@masil-status-width},24},22},#[range=control|2 fg=#{@masil-c-text}]#{?#{==:#{@masil-lang},ko},저장,Save} #[norange]#[range=control|6 fg=#{@masil-c-text}]#{?#{==:#{@masil-lang},ko},불러오기,Load} #[norange default],}#{?#{&&:#{!=:#{@masil-clock},off},#{e|>=:#{?#{@masil-status-width},#{@masil-status-width},24},30}},#[fg=#{@masil-c-muted}]%H:%M ,}#{?#{e|>=:#{?#{@masil-status-width},#{@masil-status-width},24},#{?#{==:#{@masil-lang},ko},9,13}},#[range=control|1 bg=#{@masil-c-raised} fg=#{@masil-c-text}]#{?#{==:#{@masil-lang},ko},설정,Settings} #[norange default],},#{?#{&&:#{!=:#{@masil-clock},off},#{e|>=:#{client_width},90}},#[fg=#{@masil-c-muted}]%H:%M ,}#{?#{e|>=:#{client_width},60},#[range=control|2 fg=#{@masil-c-text}]#{?#{==:#{@masil-lang},ko},저장,Save} #[norange]#[range=control|6 fg=#{@masil-c-text}]#{?#{==:#{@masil-lang},ko},불러오기,Load} #[norange default],}#{?#{e|>=:#{client_width},#{?#{==:#{@masil-lang},ko},20,24}},#[range=control|1 bg=#{@masil-c-raised} fg=#{@masil-c-text}] #{?#{==:#{@masil-lang},ko},설정,Settings} #[norange default],}}"
	set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist]#[range=control|0 fg=#{@masil-c-accent}] + #[norange default]#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
}
## masil:end

## masil:section keys
# Compact menus keep Save, Load, Settings and New tab. Other actions
# appear only when the available height fits them. Control6 means Load
# on the status bar and opens the creation menu on a pane border. +
# opens a choice of new window, floating pane or split; Layout picks a tiled
# layout. A pane title click renames the pane and a drag moves it. C-s saves
# the sessions and C-r (or the menu) picks a snapshot to restore; snapshots
# are also saved every @masil-autosave minutes (default 15, off to stop).
if -F "#{!=:#{@masil-ui},off}" {
	bind -N "masil-ui: settings" -n MouseDown1Control1 { run -C "new-pane -O -K -x 90% -y 90% -X 5% -Y 5% '#{q:@masil-agent} settings'" }
	bind -N "masil-ui: save sessions" -n MouseDown1Control2 { run-shell -b "#{q:@masil-agent} session save --socket #{q:socket_path} --client #{q:client_name}" }
	bind -N "masil-ui: select pane" -n MouseDown1Control3 { select-pane -t= }
	bind -N "masil-ui: move pane" -n MouseDrag1Control3 { resize-pane -M }
	bind -N "masil-ui: toggle sidebar width" -n MouseDown1Control4 { if -F "#{e|<=:#{?#{@masil-status-width},#{@masil-status-width},24},8}" { set -gF @masil-status-width "#{?#{@masil-sidebar-width},#{@masil-sidebar-width},24}" } { set -gF @masil-sidebar-width "#{?#{@masil-status-width},#{@masil-status-width},24}" ; set -g @masil-status-width 8 } }
	if -F "#{==:#{@masil-lang},ko}" {
		bind -N "masil-ui: rename pane" -n MouseUp1Control3 { select-pane -t= ; command-prompt -FI "#{pane_title}" -p "pane 이름:" { select-pane -T '%%' } }
		bind -N "masil-ui: new" -n MouseDown1Control0 { display-menu -t= -xM -yM -T "#[align=centre]새로 만들기" "새 탭" c "new-window -a -c #{qh;qa:pane_current_path}" "새 floating pane" f { new-pane -x 60% -y 60% } "오른쪽 분할" "%" { split-window -G -h } "아래로 분할" "\"" { split-window -G -v } }
		bind -N "masil-ui: load or create pane" -n MouseDown1Control6 { if -F "#{==:#{mouse_status_range},control}" { run-shell -b "#{q:@masil-agent} session menu --socket #{q:socket_path} --client #{q:client_name}" } { display-menu -t= -xM -yM -T "#[align=centre]pane #{pane_index}" "오른쪽 분할" "%" { split-window -G -h } "아래로 분할" "\"" { split-window -G -v } "새 floating pane" f { new-pane -x 60% -y 60% } "새 탭" c "new-window -a -c #{qh;qa:pane_current_path}" } }
		bind -N "masil-ui: menu" -n MouseDown1Control5 { if -F "#{||:#{e|<:#{window_height},18},#{e|<:#{window_width},52}}" { display-menu -t= -xM -yM -T "#[align=centre]masil" "설정" s { run -C "new-pane -O -K -x 90% -y 90% -X 5% -Y 5% '##{q:@masil-agent} settings'" } "#{?#{e|>=:#{window_height},9},에이전트,}" a { new-window -n Agents '#{q:@masil-agent} agent ui' } "새 탭" c "new-window -a -c #{qh;qa:pane_current_path}" "#{?#{e|>=:#{window_height},10},새 세션,}" S { new-session } "#{?#{e|>=:#{window_height},8},세션 목록,}" w { choose-tree -Zs } "저장" C-s { run-shell -b "#{q:@masil-agent} session save --socket #{q:socket_path} --client #{q:client_name}" } "불러오기" C-r { run-shell -b "#{q:@masil-agent} session menu --socket #{q:socket_path} --client #{q:client_name}" } "#{?#{e|>=:#{window_height},12},오른쪽 분할,}" "%" { split-window -G -h } "#{?#{e|>=:#{window_height},12},아래로 분할,}" "\"" { split-window -G -v } "#{?#{e|>=:#{window_height},13},레이아웃,}" l { display-menu -x C -y C -T "#[align=centre]레이아웃" "좌우로 나란히" h { select-layout even-horizontal } "위아래로 쌓기" v { select-layout even-vertical } "왼쪽에 큰 pane" m { select-layout main-vertical } "위에 큰 pane" M { select-layout main-horizontal } "격자" g { select-layout tiled } } "#{?#{e|>=:#{window_height},15},키 목록,}" "?" { list-keys -N } "#{?#{e|>=:#{window_height},15},tmux 설정 읽기,}" r { source-file -q /etc/tmux.conf ~/.tmux.conf ~/.config/tmux/tmux.conf } "#{?#{e|>=:#{window_height},8},분리,}" d { detach-client } } { display-menu -t= -xM -yM -T "#[align=centre]masil" "설정" s { run -C "new-pane -O -K -x 90% -y 90% -X 5% -Y 5% '##{q:@masil-agent} settings'" } "에이전트" a { new-window -n Agents '#{q:@masil-agent} agent ui' } "" "새 탭" c "new-window -a -c #{qh;qa:pane_current_path}" "새 세션" S { new-session } "세션과 창 목록" w { choose-tree -Zs } "세션 저장" C-s { run-shell -b "#{q:@masil-agent} session save --socket #{q:socket_path} --client #{q:client_name}" } "세션 불러오기" C-r { run-shell -b "#{q:@masil-agent} session menu --socket #{q:socket_path} --client #{q:client_name}" } "오른쪽으로 분할" "%" { split-window -G -h } "아래로 분할" "\"" { split-window -G -v } "레이아웃" l { display-menu -x C -y C -T "#[align=centre]레이아웃" "좌우로 나란히" h { select-layout even-horizontal } "위아래로 쌓기" v { select-layout even-vertical } "왼쪽에 큰 pane" m { select-layout main-vertical } "위에 큰 pane" M { select-layout main-horizontal } "격자" g { select-layout tiled } } "" "키 목록" "?" { list-keys -N } "tmux 설정 다시 읽기" r { source-file -q /etc/tmux.conf ~/.tmux.conf ~/.config/tmux/tmux.conf } "분리" d { detach-client } } }
	} {
		bind -N "masil-ui: rename pane" -n MouseUp1Control3 { select-pane -t= ; command-prompt -FI "#{pane_title}" -p "Pane name:" { select-pane -T '%%' } }
		bind -N "masil-ui: new" -n MouseDown1Control0 { display-menu -t= -xM -yM -T "#[align=centre]New" "New tab" c "new-window -a -c #{qh;qa:pane_current_path}" "Floating pane" f { new-pane -x 60% -y 60% } "Split right" "%" { split-window -G -h } "Split down" "\"" { split-window -G -v } }
		bind -N "masil-ui: load or create pane" -n MouseDown1Control6 { if -F "#{==:#{mouse_status_range},control}" { run-shell -b "#{q:@masil-agent} session menu --socket #{q:socket_path} --client #{q:client_name}" } { display-menu -t= -xM -yM -T "#[align=centre]Pane #{pane_index}" "Split right" "%" { split-window -G -h } "Split down" "\"" { split-window -G -v } "Floating pane" f { new-pane -x 60% -y 60% } "New tab" c "new-window -a -c #{qh;qa:pane_current_path}" } }
		bind -N "masil-ui: menu" -n MouseDown1Control5 { if -F "#{||:#{e|<:#{window_height},18},#{e|<:#{window_width},36}}" { display-menu -t= -xM -yM -T "#[align=centre]masil" "Settings" s { run -C "new-pane -O -K -x 90% -y 90% -X 5% -Y 5% '##{q:@masil-agent} settings'" } "#{?#{e|>=:#{window_height},9},Agents,}" a { new-window -n Agents '#{q:@masil-agent} agent ui' } "New tab" c "new-window -a -c #{qh;qa:pane_current_path}" "#{?#{e|>=:#{window_height},10},New session,}" S { new-session } "#{?#{e|>=:#{window_height},8},Sessions,}" w { choose-tree -Zs } "Save" C-s { run-shell -b "#{q:@masil-agent} session save --socket #{q:socket_path} --client #{q:client_name}" } "Load" C-r { run-shell -b "#{q:@masil-agent} session menu --socket #{q:socket_path} --client #{q:client_name}" } "#{?#{e|>=:#{window_height},12},Split right,}" "%" { split-window -G -h } "#{?#{e|>=:#{window_height},12},Split down,}" "\"" { split-window -G -v } "#{?#{e|>=:#{window_height},13},Layout,}" l { display-menu -x C -y C -T "#[align=centre]Layout" "Side by side" h { select-layout even-horizontal } "Stacked" v { select-layout even-vertical } "Main left" m { select-layout main-vertical } "Main top" M { select-layout main-horizontal } "Grid" g { select-layout tiled } } "#{?#{e|>=:#{window_height},15},Key list,}" "?" { list-keys -N } "#{?#{e|>=:#{window_height},15},Reload config,}" r { source-file -q /etc/tmux.conf ~/.tmux.conf ~/.config/tmux/tmux.conf } "#{?#{e|>=:#{window_height},8},Detach,}" d { detach-client } } { display-menu -t= -xM -yM -T "#[align=centre]masil" "Settings" s { run -C "new-pane -O -K -x 90% -y 90% -X 5% -Y 5% '##{q:@masil-agent} settings'" } "Agents" a { new-window -n Agents '#{q:@masil-agent} agent ui' } "" "New tab" c "new-window -a -c #{qh;qa:pane_current_path}" "New session" S { new-session } "Sessions and windows" w { choose-tree -Zs } "Save sessions" C-s { run-shell -b "#{q:@masil-agent} session save --socket #{q:socket_path} --client #{q:client_name}" } "Restore sessions" C-r { run-shell -b "#{q:@masil-agent} session menu --socket #{q:socket_path} --client #{q:client_name}" } "Split right" "%" { split-window -G -h } "Split down" "\"" { split-window -G -v } "Layout" l { display-menu -x C -y C -T "#[align=centre]Layout" "Side by side" h { select-layout even-horizontal } "Stacked" v { select-layout even-vertical } "Main left" m { select-layout main-vertical } "Main top" M { select-layout main-horizontal } "Grid" g { select-layout tiled } } "" "Key list" "?" { list-keys -N } "Reload tmux config" r { source-file -q /etc/tmux.conf ~/.tmux.conf ~/.config/tmux/tmux.conf } "Detach" d { detach-client } } }
	}
}
## masil:end

## masil:section sessions
# Saving and restoring sessions. Kept apart from the keys section, which the
# settings screen re-runs, so a user's own prefix C-s or C-r binding stays.
if -F "#{!=:#{@masil-ui},off}" {
	bind -N "masil-ui: save sessions" C-s { run-shell -b "#{q:@masil-agent} session save --socket #{q:socket_path} --client #{q:client_name}" }
	bind -N "masil-ui: restore sessions" C-r { run-shell -b "#{q:@masil-agent} session menu --socket #{q:socket_path} --client #{q:client_name}" }
	run-shell -b "#{q:@masil-agent} session autosave --socket #{q:socket_path}"
}
## masil:end
