[package]
name = "masil-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "io-util", "time", "sync", "signal", "process"] }
reqwest = { version = "0.13.5", default-features = false }
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = { version = "0.29", default-features = false, features = ["event-stream", "bracketed-paste"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"
regex = "1"
toml = "0.8"
sha2 = "0.10"
# Bundled SQLite 3.53.2 includes the WAL-reset fix (3.51.3+); see docs/design/sources.md.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
