[package]
name = "rmux-agent"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "io-util", "time", "sync", "signal"] }
reqwest = { version = "0.13.5", default-features = false }
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
