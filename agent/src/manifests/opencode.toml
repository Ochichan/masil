# Modified by masil after the import from Herdr. See NOTICE.
id = "opencode"
version = "2026.11.17.1"
min_engine_version = 4
updated_at = "2026-11-17T12:00:00Z"
# Measured 2026-10-04 on 1.18.34: the first Esc arms ("esc again to
# interrupt"), the second ends the turn; C-c exits OpenCode.
interrupt_keys = ["Escape", "Escape"]
aliases = ["open-code", "herdr:opencode"]

[[rules]]
id = "permission_required"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["△ Permission required"] },
  { contains = ["esc dismiss"], any = [{ contains = ["enter confirm"] }, { contains = ["enter submit"] }, { contains = ["enter toggle"] }], all = [{ any = [{ contains = ["↑↓ select"] }, { contains = ["⇆ tab"] }] }] },
]

[[rules]]
id = "reject_instruction"
state = "blocked"
priority = 200
region = "bottom_non_empty_lines(10)"
visible_blocker = true
contains = ["tell opencode what to do differently", "esc cancel"]

[[rules]]
id = "interrupt_hint_working"
state = "working"
priority = 110
# Measured 2026-11-17 on 1.19.5: the hint and the progress bar are on the
# footer, the last line of the screen. An answer or a draft that quotes
# them is at least five lines up.
region = "bottom_non_empty_lines(4)"
visible_working = true
interruptible = true
any = [
  { contains = ["esc to interrupt"] },
  { contains = ["ctrl+c to interrupt"] },
  { contains = ["press esc to interrupt"] },
  { line_regex = ['(?i).*opencode.*esc (again to )?interrupt'] },
]

[[rules]]
id = "progress_bar_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(4)"
visible_working = true
interruptible = true
regex = ['(■|⬝){4,}']
