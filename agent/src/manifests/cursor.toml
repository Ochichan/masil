id = "cursor"
version = "2026.10.26.1"
min_engine_version = 4
updated_at = "2026-10-26T12:00:00Z"
aliases = ["cursor-agent"]
# Measured 2026-10-26 on 2026.10.22: one C-c while working ends the turn at
# once, keeps the process, and puts the prompt back in the composer. One C-c
# at an empty composer only shows "Press Ctrl+C again to exit"; a second one
# within about 0.3 s exits. (2026.09.18 exited on one C-c that landed after
# the turn ended, measured 2026-10-04.)
interrupt_keys = ["C-c"]

[[rules]]
id = "write_file_approval"
state = "blocked"
priority = 320
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["write to this file?", "proceed (y)"]
any = [
  { contains = ["reject & propose changes"] },
  { contains = ["esc or n or p"] },
  { contains = ["add write("] },
]

[[rules]]
id = "approval_prompt"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["waiting for approval", "run this command?"], any = [{ contains = ["run (once) (y)"] }, { contains = ["skip (esc or n)"] }] },
  { contains = ["(y) (enter)"] },
  { line_regex = ['(?i)^\s*allow .*\(y\)'] },
  { contains = ["keep (n)"] },
  { contains = ["skip (esc or n)"] },
  { line_regex = ['(?i)^\s*(?:→\s*)?run .*\(y\)'] },
]

[[rules]]
id = "stop_hint_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(6)"
visible_working = true
interruptible = true
# The hint ends the composer line (measured 2026-10-04 and 2026-10-26), so a
# model answer that says "Ctrl+C to stop" is not a running turn.
line_regex = ['^\s+→ .*\S\s{2,}ctrl\+c to stop\s*$']

[[rules]]
id = "background_task_status_working"
state = "working"
priority = 95
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = ['(?i)\b[1-9][0-9]*\s+background\s+tasks?\b']

[[rules]]
id = "spinner_working"
state = "working"
priority = 90
region = "bottom_non_empty_lines(8)"
visible_working = true
line_regex = ['^\s*(⬡|⬢|[\u2800-\u28FF]+)\s+\p{Alphabetic}+\w*ing\b']

[[rules]]
id = "workspace_trust"
state = "blocked"
priority = 950
region = "whole_recent"
visible_blocker = true
# Measured 2026-10-04 on 2026.09.18. The box stays on screen after the
# answer, so only the live dialog with its key hint counts.
contains = ["workspace trust required", "trust this workspace", "use arrow keys to navigate"]
not = [{ contains = ["trusting workspace"] }]

[[rules]]
id = "instruction_input"
state = "blocked"
priority = 200
region = "bottom_non_empty_lines(4)"
visible_blocker = true
# After a skipped approval the agent waits for the person's instruction.
contains = ["tell the agent what to do instead"]

[[rules]]
id = "composer_idle"
state = "idle"
priority = 50
# Measured 2026-10-26 on 2026.10.22: a prompt of three or more composer
# lines (wrapped or multi-line) pushes the arrow line above the bottom four
# lines, so the region reaches twelve.
region = "bottom_non_empty_lines(12)"
visible_idle = true
# Measured 2026-10-04 on 2026.09.18: the composer line starts with an arrow.
line_regex = ['^\s+→ \S']
# Measured 2026-10-26: after a turn (2026.10.01) the composer reads
# "→ Add a follow-up" with no stop hint; while a turn runs (2026.10.22) the
# same line ends in "ctrl+c to stop". Text starting with "/" opens the
# command menu, whose selected entry ("→ /help copy   Copy message") is not
# a composer.
not = [
  { line_regex = ['^\s+→ .*\S\s{2,}ctrl\+c to stop\s*$'] },
  { line_regex = ['^\s+→ /\S.*\S\s{2,}\S'] },
]
