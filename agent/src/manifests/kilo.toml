id = "kilo"
version = "2026.10.26.1"
min_engine_version = 1
updated_at = "2026-10-26T12:00:00Z"
aliases = ["kilo-code", "kilo code", "herdr:kilo"]

[[rules]]
id = "opencode_permission"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["△ Permission required"] },
  { contains = ["esc dismiss"], any = [{ contains = ["enter confirm"] }, { contains = ["enter submit"] }, { contains = ["enter toggle"] }], all = [{ any = [{ contains = ["↑↓ select"] }, { contains = ["⇆ tab"] }] }] },
]

[[rules]]
id = "esc_interrupt_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
contains = ["esc interrupt"]

[[rules]]
id = "reject_instruction"
state = "blocked"
priority = 200
region = "bottom_non_empty_lines(10)"
visible_blocker = true
# Measured 2026-10-26 on 7.8.17: Escape on a permission dialog opens
# "Reject permission", which waits for the person's instruction.
contains = ["tell kilo what to do differently", "esc cancel"]
