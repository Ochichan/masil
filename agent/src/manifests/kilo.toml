# Modified by masil after the import from Herdr. See NOTICE.
id = "kilo"
version = "2026.11.17.1"
min_engine_version = 4
updated_at = "2026-11-17T12:00:00Z"
# Measured 2026-11-17 on 7.8.17: the first Esc arms ("esc again to
# interrupt"), the second ends the turn ("· interrupted").
interrupt_keys = ["Escape", "Escape"]
aliases = ["kilo-code", "kilo code", "herdr:kilo"]

[[rules]]
id = "opencode_permission"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["△ Permission required"] },
  { contains = ["esc dismiss"], any = [{ contains = ["enter confirm"] }, { contains = ["enter submit"] }, { contains = ["enter toggle"] }], all = [{ any = [{ contains = ["↑↓ select"] }, { contains = ["⇆ tab"] }] }] },
]

[[rules]]
id = "esc_interrupt_working"
state = "working"
priority = 100
# The hint is on the footer, the last line of the screen at 80 and 150
# columns. An answer or a draft that quotes it is at least five lines up.
region = "bottom_non_empty_lines(4)"
visible_working = true
interruptible = true
any = [
  { contains = ["esc interrupt"] },
  { contains = ["esc again to interrupt"] },
]

[[rules]]
id = "reject_instruction"
state = "blocked"
priority = 200
region = "bottom_non_empty_lines(10)"
visible_blocker = true
# Measured 2026-10-26 on 7.8.17: Escape on a permission dialog opens
# "Reject permission", which waits for the person's instruction.
contains = ["tell kilo what to do differently", "esc cancel"]
