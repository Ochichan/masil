name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag and package version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python3 scripts/release.py validate --version "$RELEASE_VERSION"
  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}
  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: masil-*
          path: .build/release
          merge-multiple: true
      - name: Prepare source archive, Homebrew formula and checksums
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python3 scripts/release.py prepare --version "$RELEASE_VERSION"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" .build/release/* \
            --verify-tag --draft --title "masil $RELEASE_VERSION" --generate-notes
