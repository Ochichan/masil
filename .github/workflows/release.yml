name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag and versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate tag and synchronized package versions
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python3 scripts/release.py validate --version "$RELEASE_VERSION"

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      version: ${{ github.ref_name }}

  release:
    name: Assemble, attest, and publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Download and verify platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p .build/release
          python3 scripts/download_release_artifacts.py platforms \
            --version "$RELEASE_VERSION" \
            --dest .build/release
      - name: Prepare source archive, formula, PKGBUILD, installer, and SHA256SUMS
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py prepare --version "$RELEASE_VERSION"
          (cd .build/release && sha256sum --check SHA256SUMS)
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .build/release/masil-*.tar.gz
            .build/release/install.sh
            .build/release/masil.rb
            .build/release/PKGBUILD
            .build/release/SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          extra_flags=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            extra_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_VERSION" \
            .build/release/masil-*.tar.gz \
            .build/release/install.sh \
            .build/release/masil.rb \
            .build/release/PKGBUILD \
            .build/release/SHA256SUMS \
            "${extra_flags[@]}" \
            --verify-tag \
            --title "masil $RELEASE_VERSION" \
            --generate-notes
      - name: Upload release metadata for packaging channels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: |
            .build/release/SHA256SUMS
            .build/release/masil.rb
            .build/release/PKGBUILD
          if-no-files-found: error
          retention-days: 7

  # --- One-click packaging channels (stable v* tags only) -------------------------------
  # Each job cleanly no-ops when its repository secret is unset (forks or before one-time
  # secret setup), so releases never fail on unconfigured optional channels.

  publish-homebrew:
    name: Publish Homebrew tap
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Download verified release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .build/release
          python3 scripts/download_release_artifacts.py checksums --dest .build/release
          echo "--- rendered Formula/masil.rb ---"
          cat .build/release/masil.rb
      - name: Push Formula/masil.rb to Ochichan/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN unset — skipping Homebrew tap publish"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/Ochichan/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp .build/release/masil.rb tap/Formula/masil.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/masil.rb
          if git diff --cached --quiet; then
            echo "Formula/masil.rb already up to date"
            exit 0
          fi
          git commit -m "masil ${RELEASE_VERSION}"
          git push

  publish-aur:
    name: Publish AUR package
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Download verified release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .build/release
          python3 scripts/download_release_artifacts.py checksums --dest .build/release
          echo "--- rendered PKGBUILD ---"
          cat .build/release/PKGBUILD
      - name: Publish to AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: masil
          pkgbuild: .build/release/PKGBUILD
          commit_username: Ochichan
          commit_email: ohstar94@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
          updpkgsums: true
