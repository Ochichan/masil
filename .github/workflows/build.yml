name: Native build

on:
  workflow_call:
    inputs:
      version:
        description: Release tag, or empty for a development artifact
        type: string
        default: ''

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply chain & packaging gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          echo 'RUSTUP_TOOLCHAIN=1.96.0' >> "$GITHUB_ENV"
      - name: Install pinned cargo-deny
        run: cargo install --locked cargo-deny --version 0.19.9
      - name: RustSec advisories (full feature graph)
        run: |
          for manifest in agent/Cargo.toml relay/Cargo.toml crates/masil-wire/Cargo.toml; do
            echo "== advisories: $manifest =="
            cargo deny --manifest-path "$manifest" --all-features check --config deny.toml advisories
          done
      - name: Dependency policy (bans, licenses, sources)
        run: |
          for manifest in agent/Cargo.toml relay/Cargo.toml crates/masil-wire/Cargo.toml; do
            echo "== policy: $manifest =="
            cargo deny --manifest-path "$manifest" check --config deny.toml bans licenses sources
          done
      - name: Verify synchronized package versions
        run: python3 scripts/release.py validate-versions
      - name: Release & artifact downloader regression tests
        run: |
          python3 -m unittest -v tests/test_download_release_artifacts.py
          python3 -m unittest -v tests/test_release.py
      - name: Lint installer and packaging templates
        run: |
          shellcheck install.sh
          grep -q '__VERSION__' packaging/aur/PKGBUILD.tmpl
          grep -q '__SHA_SOURCE__' packaging/aur/PKGBUILD.tmpl
          grep -q '# Stable release metadata is inserted here.' Formula/masil.rb

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path agent/Cargo.toml --check
      - name: Lint Rust
        run: cargo clippy --locked --manifest-path agent/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --locked --manifest-path agent/Cargo.toml
      - name: Build and run core regressions
        run: make test-ci
      - name: Test performance measurement tools
        run: make test-benchmark
      - name: Smoke test
        run: python3 scripts/ci_smoke.py bin
      - name: Package and test the extracted archive
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/release.py package --version "$RELEASE_VERSION"
          mkdir -p .build/extracted
          tar -xzf .build/release/masil-*.tar.gz -C .build/extracted
          python3 scripts/ci_smoke.py .build/extracted/masil-*/bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: masil-${{ matrix.target }}
          path: |
            .build/release/*.tar.gz
            .build/release/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.target }}
          path: .build/logs/
          retention-days: 7

  homebrew:
    name: Homebrew formula
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Test the formula against this checkout
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          tap="$(brew --repository)/Library/Taps/ochichan/homebrew-masil"
          mkdir -p "$tap/Formula"
          python3 scripts/release.py local-formula --output "$tap/Formula/masil.rb"
          brew install --build-from-source ochichan/masil/masil
          brew test ochichan/masil/masil
          brew linkage --test ochichan/masil/masil

  relay:
    name: Wire & Relay (Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.96.0'
          components: rustfmt, clippy
      - name: Check wire crate
        run: |
          cargo fmt --manifest-path crates/masil-wire/Cargo.toml --check
          cargo clippy --locked --manifest-path crates/masil-wire/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path crates/masil-wire/Cargo.toml
      - name: Check relay server
        run: |
          cargo fmt --manifest-path relay/Cargo.toml --check
          cargo clippy --locked --manifest-path relay/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path relay/Cargo.toml

  mobile-checks:
    name: Mobile App (TypeScript & Expo)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Typecheck, test, and verify Expo config
        working-directory: mobile
        run: |
          npm run typecheck
          npm run lint
          npm test
          npx expo config --type public > /dev/null
